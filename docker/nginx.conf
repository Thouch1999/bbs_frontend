server {
    listen 80;
    server_name _;

    # Operator licence uploads go through here (POST /api/operators/register/
    # proxies to the backend) — must be at least the backend's own upload cap
    # (apps.core.validators.MAX_LICENCE_DOCUMENT_SIZE_BYTES = 10MB, plus
    # DATA_UPLOAD_MAX_MEMORY_SIZE/FILE_UPLOAD_MAX_MEMORY_SIZE = 15MB), or a
    # legitimate upload gets an opaque 413 from nginx before Django ever
    # sees it and returns its own clear validation error.
    client_max_body_size 16m;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;
    # Brotli is deliberately not enabled here: the stock nginx:alpine image
    # doesn't ship ngx_brotli, and bolting on a third-party module build
    # without being able to build/run this image on the current dev machine
    # (no Docker here — see CLAUDE.md) risks shipping a config that fails
    # `nginx -t` on first real deploy. gzip covers the same asset types;
    # see docs/DEPLOYMENT.md for how to add brotli later.

    root /usr/share/nginx/html;
    index index.html;

    # Vite's hashed build output (assets/xxx-<hash>.js/css) never changes
    # under the same filename, so it's safe to cache "forever".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The service worker itself must always be revalidated so a deployed
    # update is picked up promptly — vite-plugin-pwa's own precache manifest
    # is what actually versions the app shell, not this file's own caching.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # workbox-*.js is content-hashed by vite-plugin-pwa, same as /assets/.
    location ~ ^/workbox-.*\.js$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Self-hosted fonts (Kantumruy Pro, Inter) — CLAUDE.md: never from a CDN.
    location ~* \.(woff2?|ttf|otf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html must always be revalidated — it references the current
    # hashed asset filenames, so a stale cached copy would 404 on old assets
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Uploaded media (operator licence documents, bus photos) — served
    # directly from the shared volume, not proxied through gunicorn.
    location /media/ {
        alias /usr/share/nginx/media/;
    }

    # Django admin's own static assets (collectstatic output), same shared-
    # volume pattern as /media/ above.
    location /static/ {
        alias /usr/share/nginx/static/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exposed at the edge too, so an external load balancer can healthcheck
    # the whole stack through nginx, not just the backend container directly
    # (docker-compose's own healthcheck: for the backend service still hits
    # it on localhost inside that container — see docker-compose.prod.yml).
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
        proxy_set_header Host $host;
    }

    location = /readyz {
        proxy_pass http://backend:8000/readyz;
        proxy_set_header Host $host;
    }

    location /admin/ {
        proxy_pass http://backend:8000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router (client-side routing) — any path that isn't a static
    # file or one of the above falls through to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
